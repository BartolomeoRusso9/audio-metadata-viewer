name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da rilasciare (es. 1.0.1)'
        required: true
        type: string
        default: '1.0.1'

permissions:
  contents: write

jobs:
  # FASE 1: I tre server compilano i file
  build:
    name: Build su ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup di Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installazione pulita delle dipendenze
        run: npm ci

      - name: Imposta la versione manuale (solo se avviato a mano)
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build dei pacchetti (Senza Pubblicazione)
        # Ho rimosso '--publish always'. Ora crea solo i file senza caricarli online.
        run: npx electron-builder

      - name: Parcheggia i file temporaneamente
        uses: actions/upload-artifact@v4
        with:
          name: pacchetti-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: ignore

  # FASE 2: Un server raccoglie tutti i file e crea la Release unica
  publish_release:
    name: Unifica e Pubblica la Release
    needs: build # Aspetta tassativamente che "build" abbia finito su tutti e 3 i sistemi
    runs-on: ubuntu-latest
    steps:
      - name: Raccogli tutti i pacchetti scaricati
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true # Unisce i file di Mac, Windows e Linux nella stessa cartella

      - name: Crea la singola Release su GitHub
        uses: softprops/action-gh-release@v2
        with:
          # Se lo avvii a mano aggiunge la 'v' al numero inserito (es. v1.0.1), altrimenti usa il tag pushato
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          draft: true # Mantiene la release come bozza per farti controllare prima
          files: release-files/*