name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Aggiunge un form da compilare quando avvii il workflow manualmente
    inputs:
      version:
        description: 'Versione da rilasciare (es. 1.0.1)'
        required: true
        type: string
        default: '1.0.1'

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup di Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installazione pulita delle dipendenze
        run: npm ci

      # Se il workflow è stato avviato manualmente, imposta la versione scelta
      - name: Imposta la versione manuale
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build e Pubblicazione su GitHub Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}