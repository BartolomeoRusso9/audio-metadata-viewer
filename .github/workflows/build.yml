name: Build and Release

on:
  push:
    # Il workflow partirà SOLO quando fai il push di un tag che inizia con "v"
    tags:
      - 'v*'

permissions:
  # Permesso fondamentale: autorizza GitHub Actions a creare la Release e caricare i file
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Evita che se fallisce un OS, vengano bloccati anche gli altri
      fail-fast: false 
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup di Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installazione pulita delle dipendenze
        run: npm ci

      - name: Build e Pubblicazione su GitHub Releases
        run: npx electron-builder --publish always
        env:
          # Questo token è generato automaticamente da GitHub in ogni esecuzione
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}