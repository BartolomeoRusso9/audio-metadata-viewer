name: Build and Release Audio Metadata Viewer

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag name (e.g. v1.0.1)'
        required: false
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.commit_and_bump.outputs.NEW_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes and bump version
        id: commit_and_bump
        shell: bash
        run: |
          USER_INPUT="${{ github.event.inputs.version_tag }}"

          if [[ -n "$USER_INPUT" ]]; then
            echo "Using manually provided tag: $USER_INPUT"
            NEW_TAG="$USER_INPUT"
            # Strip the leading 'v' if present, since npm version expects a plain number
            CLEAN_VERSION="${NEW_TAG#v}"
            npm version "$CLEAN_VERSION" --allow-same-version -m "chore(release): %s [skip ci]"
          else
            echo "Auto-bumping patch version..."
            npm version patch -m "chore(release): %s [skip ci]"
            NEW_TAG=$(node -p "require('./package.json').version")
            NEW_TAG="v$NEW_TAG"
          fi

          git push --follow-tags
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.bump.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Audio Metadata Viewer
        # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from looking for a
        # macOS signing certificate (we don't have an Apple Developer identity in CI).
        # This env var is safe on every OS in the matrix, unlike the CLI flag
        # "-c.mac.identity=null", which electron-builder's Windows CLI parser
        # misreads as a config *file path* and crashes with ENOENT.
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          retention-days: 7
          if-no-files-found: ignore

  release:
      needs: [bump, build]
      runs-on: ubuntu-latest

      steps:
        - name: Download all build artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: packages-*
            path: release-files
            merge-multiple: true

        - name: Prepare Final Release Body
          run: |
            cat << 'EOF' > release_body.md
            ### DOWNLOADS

            [![Windows](https://img.shields.io/badge/Windows-[DOWNLOAD]-0078D6?style=for-the-badge&logo=windows&logoColor=white)](#)
            [![macOS](https://img.shields.io/badge/macOS-[DOWNLOAD]-000000?style=for-the-badge&logo=apple&logoColor=white)](#)
            [![Linux](https://img.shields.io/badge/Linux-[DOWNLOAD]-FFB300?style=for-the-badge&logo=linux&logoColor=black)](#)

            <details>
            <summary><b>💻 Installation notes</b></summary>

            - **Windows**: Download the `.exe` file and run it.
            - **macOS**: Download the `.dmg` file, open it, and drag the app into the Applications folder. (Note: you may need to allow the app in System Settings, since it isn't code-signed).
            - **Linux**: Download the `.AppImage` file (make it executable with `chmod +x`) or install the `.deb` package.
            </details>
            EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.bump.outputs.release_tag }}
            files: release-files/*
            draft: false
            prerelease: false
            body_path: release_body.md
            # Enables GitHub's automatic release notes generation
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
