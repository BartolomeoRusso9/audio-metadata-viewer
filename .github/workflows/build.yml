name: Build and Release

on:
  push:
    # Si avvia in automatico quando fai il push di un tag (es. v1.0.0)
    tags:
      - 'v*'
  # Aggiunge il pulsante su GitHub per avviarlo manualmente
  workflow_dispatch:

permissions:
  # Permesso per creare la Release
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup di Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installazione pulita delle dipendenze
        run: npm ci

      - name: Build e Pubblicazione su GitHub Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}