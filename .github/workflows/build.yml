name: Build and Release Audio Metadata Viewer

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Nome del tag di versione (es: v1.0.1)'
        required: false
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.commit_and_bump.outputs.NEW_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes and bump version
        id: commit_and_bump
        shell: bash
        run: |
          USER_INPUT="${{ github.event.inputs.version_tag }}"
          
          if [[ -n "$USER_INPUT" ]]; then
            echo "Using manually provided tag: $USER_INPUT"
            NEW_TAG="$USER_INPUT"
            # Rimuove la 'v' iniziale se presente, poiché npm version preferisce i numeri puri
            CLEAN_VERSION="${NEW_TAG#v}"
            npm version "$CLEAN_VERSION" --allow-same-version -m "chore(release): %s [skip ci]"
          else
            echo "Auto-bumping patch version..."
            npm version patch -m "chore(release): %s [skip ci]"
            NEW_TAG=$(node -p "require('./package.json').version")
            NEW_TAG="v$NEW_TAG"
          fi
          
          git push --follow-tags
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.bump.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Audio Metadata Viewer
        # Previene gli errori di firma su macOS e ferma la pubblicazione automatica di electron-builder
        run: npx electron-builder --publish never -c.mac.identity=null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacchetti-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          retention-days: 7
          if-no-files-found: ignore

  release:
      needs: [bump, build]
      runs-on: ubuntu-latest
      
      steps:
        - name: Download all build artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: pacchetti-*
            path: release-files
            merge-multiple: true

        - name: Prepare Final Release Body
          run: |
            cat << 'EOF' > release_body.md
            ### DOWNLOADS
            
            [![Windows](https://img.shields.io/badge/Windows-[DOWNLOAD]-0078D6?style=for-the-badge&logo=windows&logoColor=white)](#) 
            [![macOS](https://img.shields.io/badge/macOS-[DOWNLOAD]-000000?style=for-the-badge&logo=apple&logoColor=white)](#) 
            [![Linux](https://img.shields.io/badge/Linux-[DOWNLOAD]-FFB300?style=for-the-badge&logo=linux&logoColor=black)](#)

            <details>
            <summary><b>💻 Informazioni sull'installazione</b></summary>
            
            - **Windows**: Scarica il file `.exe` ed eseguilo.
            - **macOS**: Scarica il file `.dmg`, aprilo e trascina l'app nella cartella Applicazioni. (Nota: potresti dover autorizzare l'app dalle impostazioni di sistema in quanto non firmata).
            - **Linux**: Scarica il file `.AppImage` (rendilo eseguibile con `chmod +x`) oppure installa il file `.deb`.
            </details>
            EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.bump.outputs.release_tag }}
            files: release-files/*
            draft: false
            prerelease: false
            body_path: release_body.md
            # Attiva la generazione automatica delle note di rilascio di GitHub
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}