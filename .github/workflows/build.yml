name: Build and Release Audio Metadata Viewer

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag to build (e.g. v1.0.1) — moved to the tip of main if it already exists'
        required: true
        type: string

jobs:
  # Only runs for manual dispatch. Moves version_tag to the current tip of
  # main, so you can re-run a release (e.g. after fixing package-lock.json)
  # without having to delete/recreate the tag by hand every time.
  retag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Move tag to tip of main
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          # Delete the tag locally and on the remote if it already exists.
          # Errors here just mean the tag was new — safe to ignore.
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: retag
    if: always() && (needs.retag.result == 'success' || needs.retag.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Audio Metadata Viewer
        # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from looking for a
        # macOS signing certificate (we don't have an Apple Developer identity in CI).
        # This env var is safe on every OS in the matrix, unlike the CLI flag
        # "-c.mac.identity=null", which electron-builder's Windows CLI parser
        # misreads as a config *file path* and crashes with ENOENT.
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          retention-days: 7
          if-no-files-found: ignore

  release:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Determine release tag
          id: tag
          run: |
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "release_tag=${{ github.event.inputs.version_tag }}" >> "$GITHUB_OUTPUT"
            else
              echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            fi

        - name: Download all build artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: packages-*
            path: release-files
            merge-multiple: true

        - name: Prepare Final Release Body
          run: |
            cat << 'EOF' > release_body.md
            ### DOWNLOADS

            [![Windows](https://img.shields.io/badge/Windows-[DOWNLOAD]-0078D6?style=for-the-badge&logo=windows&logoColor=white)](#)
            [![macOS](https://img.shields.io/badge/macOS-[DOWNLOAD]-000000?style=for-the-badge&logo=apple&logoColor=white)](#)
            [![Linux](https://img.shields.io/badge/Linux-[DOWNLOAD]-FFB300?style=for-the-badge&logo=linux&logoColor=black)](#)

            <details>
            <summary><b>💻 Installation notes</b></summary>

            - **Windows**: Download the `.exe` file and run it.
            - **macOS**: Download the `.dmg` file, open it, and drag the app into the Applications folder. (Note: you may need to allow the app in System Settings, since it isn't code-signed).
            - **Linux**: Download the `.AppImage` file (make it executable with `chmod +x`) or install the `.deb` package.
            </details>
            EOF

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.tag.outputs.release_tag }}
            files: release-files/*
            draft: false
            prerelease: false
            body_path: release_body.md
            # Enables GitHub's automatic release notes generation
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}